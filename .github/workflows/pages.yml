name: Publicar site no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Configurar Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Gerar páginas em português e inglês
        run: node scripts/build-public.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
      - name: Verificar publicação
        run: node scripts/check.mjs _site --public
      - name: Empacotar somente o site público
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
